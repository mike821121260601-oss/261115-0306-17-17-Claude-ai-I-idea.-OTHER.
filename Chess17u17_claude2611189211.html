<script id="app">
/*W0*/
const N=17, PAWN_STEPS=5; let CELL=44;
const BACK="RNBANBCQKQCBNABNR", SECOND="BNRCAQBRNRBQACRNB";
const VAL={P:1,N:3,B:3,R:5,A:7,C:8,Q:9,K:100};
const ROOK=[[1,0],[-1,0],[0,1],[0,-1]], BISH=[[1,1],[1,-1],[-1,1],[-1,-1]];
const KNIGHT=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]], KING=ROOK.concat(BISH);
/*W1*/
const CIR=(x,y,r)=>`M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0`;
const IC={
P:CIR(10,6,2.5)+'M6 16.5c0-4 1.5-5.5 4-5.5s4 1.5 4 5.5z',
R:'M5 16.5h10v-2H5zM6 14.5V8.5h8v6M5 8.5V4.5h2v1.5h2V4.5h2v1.5h2V4.5h2v4z',
N:'M5 16.5V14c0-4 1-7 5-10l1 2c3 1 4 4 4 8v2.5z'+CIR(9,8,.6),
B:CIR(10,3.5,1)+'M10 5c-3 2-4 5-2 8h4c2-3 1-6-2-8zM6 16.5h8l-1.5-3.5h-5z',
Q:'M4 6l2 8h8l2-8-3.5 4L10 4.5 7.5 10zM6 16.5h8v-2.5H6z',
K:'M10 2.5v4M8 4.5h4M10 7c-4 0-6 3-5 6l1 3.5h8L15 13c1-3-1-6-5-6z'};
IC.A=IC.B; IC.C=IC.R;

const EINFO = {
  'human':'',
  'alphabeta deepseek hybrid':'~1650 · ~100с',
  'Claude':'1с~1400 3с~1470 20с~1590 150с~1720',
  'alphabeta deepseek rapeval':'нова: singular + мобільність Rapchess',
  'alphabeta deepseek eval':'~1600 · ~45с',
  'alphabeta deepseek singular':'~1570 · ~30с',
  'alphabeta deepseek probcut':'~1490 · ~17с',
  'speedspec261116time':'~1480 · ~14с',
  'specialeval261116time':'~1450 · ~30с',
  'alphabeta deepseek full':'~1420 · ~15с',
  'alphabeta deepseek aggressive':'~1400 · ~22с',
  'alphabeta deepseek mate 3':'~1350 · ~30с',
  'alphabeta deepseek asp nullmove':'~1320 · ~15с',
  'alphabeta deepseek':'~1170 · ~10с',
  'alphabeta takes check small on big or new attacks':'~1050 · ~5с',
  'alphabeta middletosides sort':'~980 · ~5с',
  'alphabeta deepseek mate 2':'~950 · ~5с',
  'test pains board alphabeta':'~920 · ~5с',
  'alphabeta':'~880 · ~3с',
  'alphabeta deepseek mate 4+':'~1550 · 150с (пов.)',
  'speedmate261116time':'~1520 · ~75с',
  'mcts puct deepseek':'~850 · ~115с',
  'mcts rave tree deepseek':'~820 · ~90с',
  'mcts rave deepseek':'~800 · ~65с',
  'mcts eval deepseek':'~770 · ~50с',
  'mcts deepseek':'~740 · ~42с',
  'greedy':'~400 · <1с',
  'random':'~200 · <1с'
};
function updInfo(){
  document.getElementById('wi').textContent = EINFO[document.getElementById('w').value] || '';
  document.getElementById('ki').textContent = EINFO[document.getElementById('k').value] || '';
}

let b,turn,sel,over,note,last,paused=false,H=[],cur=0;
const SLOTS=111, mem={}; let slot=1, MV=[];
const KEY=n=>'c17_'+n;
const store={get:k=>{try{return localStorage.getItem(k)}catch(_){return mem[k]||null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){mem[k]=v}}};
const save=()=>{store.set(KEY(slot),JSON.stringify({mv:MV,cur}));store.set('c17_cur',String(slot))};
const bd=document.getElementById('bd'), wr=document.getElementById('wrap');
const side=()=>document.getElementById(turn?'w':'k').value;
const snap=()=>({b:JSON.stringify(b),turn,over,note,last});
const load=s=>{b=JSON.parse(s.b);turn=s.turn;over=s.over;note=s.note;last=s.last;sel=null};

function init(){
  b=Array.from({length:N},()=>Array(N).fill(null));
  for(let c=0;c<N;c++){
    for(const r of[0,2,4]){b[r][c]={t:'P',w:0};b[N-1-r][c]={t:'P',w:1}}
    b[1][c]={t:BACK[c],w:0};b[3][c]={t:SECOND[c],w:0};
    b[15][c]={t:BACK[c],w:1};b[13][c]={t:SECOND[c],w:1};
  }
  turn=1;sel=null;over=false;note='';last=null;H=[snap()];cur=0;MV=[];
}

/*W0*/
function moves(r,c){
  const p=b[r][c],w=p.w,t=p.t,o=[];
  const ok=(y,x)=>y>=0&&y<N&&x>=0&&x<N;
  const slide=ds=>{for(const[dy,dx]of ds){let y=r+dy,x=c+dx;
    while(ok(y,x)){if(b[y][x]){if(b[y][x].w!=w)o.push([y,x]);break}o.push([y,x]);y+=dy;x+=dx}}};
  const step=ds=>{for(const[dy,dx]of ds){const y=r+dy,x=c+dx;
    if(ok(y,x)&&(!b[y][x]||b[y][x].w!=w))o.push([y,x])}};
  if(t=='P'){
    const d=w?-1:1;
    for(let k=1;k<=PAWN_STEPS;k++){const y=r+d*k;if(!ok(y,c)||b[y][c])break;o.push([y,c])}
    const y=r+d;
    for(const dx of[-1,1])if(ok(y,c+dx)&&b[y][c+dx]&&b[y][c+dx].w!=w)o.push([y,c+dx]);
  }
  if('QRC'.includes(t))slide(ROOK);
  if('QBA'.includes(t))slide(BISH);
  if('NAC'.includes(t))step(KNIGHT);
  if(t=='K')step(KING);
  return o;
}
/*W1*/
function all(){const l=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=b[r][c];
    if(p&&p.w==turn)for(const[y,x]of moves(r,c))l.push({r,c,y,x})}
  return l}

function apply(r,c,y,x){
  const cap=b[y][x];b[y][x]=b[r][c];b[r][c]=null;
  const p=b[y][x];if(p.t=='P'&&(y==0||y==N-1))p.t='Q';
  last=[r,c,y,x];sel=null;
  if(cap&&cap.t=='K'){over=true;note=(p.w?'Білі':'Чорні')+' виграли: взяли короля'}
  else if(MV.length>=1000){over=true;note='Нічия: 1000 ходів'}
  else turn^=1;
}
function mv(r,c,y,x){
  H.length=cur+1;MV.length=cur;
  apply(r,c,y,x);
  H.push(snap());MV.push([r,c,y,x]);cur++;save();draw();
}
function openSlot(n,fresh){cancelThink();
  slot=n;init();
  if(!fresh){
    try{
      const d=JSON.parse(store.get(KEY(n))||'null');
      if(d&&Array.isArray(d.mv)){
        for(const m of d.mv){if(over)break;apply(...m);H.push(snap());MV.push(m)}
        cur=Math.min(d.cur|0,H.length-1);load(H[cur]);
      }
    }catch(_){init()}
  }
  save();draw();
}
function go(d){cancelThink();
  const n=cur+d;if(n<0||n>=H.length)return;
  cur=n;load(H[cur]);paused=true;
  document.getElementById('p').textContent='Продовжити';save();draw();
}

/*W0*/
const engines={
  random:l=>l[Math.random()*l.length|0],
  greedy:l=>{let best=-1,bs=[];
    for(const m of l){const t=b[m.y][m.x];
      const s=(t?VAL[t.t]:0)+(b[m.r][m.c].t=='P'&&(m.y==0||m.y==N-1)?8:0);
      if(s>best){best=s;bs=[m]}else if(s==best)bs.push(m)}
    return bs[Math.random()*bs.length|0]}
};

const INF=1e9, WIN=1e6;
let nodes=0, deadline=0, aborted=false;
const RK=[]; [8,7,9,6,10,5,11,4,12,3,13,2,14,1,15,0,16].forEach((c,i)=>RK[c]=i);
let SORTMID=false;
let ATT=false, CUT=0;
const CNT=new Array(8).fill(0);
const CL=['без змін','мала→велика/шах','нова на рівну','більша, ніж була','більше нападів','інша к-сть/вид','інші цілі','взяття/перетв.'];
let PAIN=null, lastPain=null;
function pain(side,m,v,base,ex){
  const P=PAIN[side], i=m.y*N+m.x, j=m.r*N+m.c, adj=P[i]*100;
  const loss=(v-base)/100;
  if(ex&&loss<=-1){if(loss<P[i])P[i]=loss; if(loss*.01<P[j])P[j]=loss*.01}
  return v+adj;
}
function attackSet(r,c){const m=new Map();for(const[y,x]of moves(r,c)){const t=b[y][x];if(t)m.set(y*N+x,VAL[t.t])}return m}
const comp=a=>[...a.values()].sort((u,v)=>u-v).join();
function qclass(pv,A0,A1){
  let nm=-1;for(const[q,v]of A1)if(!A0.has(q)&&v>nm)nm=v;
  if(nm>pv)return[3e4+nm*16-pv,1];
  if(nm==pv)return[2e4+nm,2];
  let m0=0,m1=0;for(const v of A0.values())m0=Math.max(m0,v);for(const v of A1.values())m1=Math.max(m1,v);
  if(m1>m0)return[15e3+m1-m0,3];
  if(A1.size>A0.size)return[1e4+A1.size-A0.size,4];
  if(A1.size!=A0.size||comp(A0)!=comp(A1))return[5e3+A1.size,5];
  for(const q of A1.keys())if(!A0.has(q))return[4e3+A1.size,6];
  return[0,0];
}
function gen(side,caps){
  const l=[],useA=ATT&&!caps;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=b[r][c];if(!p||p.w!=side)continue;
    const ms=moves(r,c);let A0=null;
    if(useA){A0=new Map();for(const[y,x]of ms){const t=b[y][x];if(t)A0.set(y*N+x,VAL[t.t])}}
    for(const[y,x]of ms){
      const t=b[y][x];if(caps&&!t)continue;
      const m={r,c,y,x,s:0},promo=p.t=='P'&&(y==0||y==N-1);
      if(useA){
        if(t){m.s=1e5+VAL[t.t]*16-VAL[p.t];CNT[7]++}
        else if(promo){m.s=5e4;CNT[7]++}
        else{make(m);const A1=attackSet(y,x);unmake(m);const[sc,k]=qclass(VAL[p.t],A0,A1);m.s=sc;CNT[k]++}
      }else m.s=t?VAL[t.t]*16-VAL[p.t]:(promo?500:0);
      l.push(m);
    }
  }
  l.sort((u,v)=>v.s-u.s||(SORTMID?RK[u.c]-RK[v.c]||RK[u.x]-RK[v.x]:0));return l;
}
function make(m){const p=b[m.r][m.c];m.cap=b[m.y][m.x];m.pt=p.t;b[m.y][m.x]=p;b[m.r][m.c]=null;if(p.t=='P'&&(m.y==0||m.y==N-1))p.t='Q'}
function unmake(m){const p=b[m.y][m.x];p.t=m.pt;b[m.r][m.c]=p;b[m.y][m.x]=m.cap}
function ev(side){
  let s=0;
  for(let r=0;r<N;r++){const row=b[r];for(let c=0;c<N;c++){const p=row[c];if(!p)continue;
    let v=VAL[p.t]*100;
    if(p.t=='P')v+=(p.w?N-1-r:r)*2;
    else if(p.t!='K')v+=8-Math.abs(r-8)*.5-Math.abs(c-8)*.5;
    s+=p.w?v:-v}}
  return side?s:-s;
}
function stop(){if(++nodes%256==0&&Date.now()>deadline)aborted=true;return aborted}
function qs(side,al,be,d){
  if(stop())return 0;
  const st=ev(side);
  if(d==0||st>=be)return st;
  if(st>al)al=st;
  for(const m of gen(side,true)){
    if(b[m.y][m.x].t=='K')return WIN;
    make(m);const v=-qs(side^1,-be,-al,d-1);unmake(m);
    if(aborted)return 0;
    if(v>=be){CUT++;return v}
    if(v>al)al=v;
  }
  return al;
}
function ab(side,d,al,be,ply){
  if(d==0)return qs(side,al,be,4);
  if(stop())return 0;
  const l=gen(side,false);
  if(!l.length)return 0;
  let best=-INF;
  const base=PAIN?ev(side):0;
  for(const m of l){
    if(b[m.y][m.x]&&b[m.y][m.x].t=='K')return WIN-ply;
    make(m);let v=(PAIN&&d==1)?-qs(side^1,-INF,INF,4):-ab(side^1,d-1,-be,-al,ply+1);unmake(m);
    if(aborted)return 0;
    if(PAIN)v=pain(side,m,v,base,d==1||(v>al&&v<be));
    if(v>best)best=v;
    if(best>al)al=best;
    if(al>=be){CUT++;break}
  }
  return best;
}
function runAB(name,mid,pains,att){
  SORTMID=mid;PAIN=pains?[new Float32Array(N*N),new Float32Array(N*N)]:null;
  ATT=att||document.getElementById('ao').checked;CNT.fill(0);CUT=0;const t0=Date.now();let doneD=0,score=0;
  const side=turn,D=+document.getElementById('dp').value||2,T=(+document.getElementById('tm').value||3)*1000;
  const root=gen(side,false), base0=PAIN?ev(side):0;
  let best=root[0];
  nodes=0;aborted=false;deadline=Date.now()+T;
  for(let d=1;d<=D;d++){
    let al=-INF,bm=null;
    for(const m of root){
      let v;
      if(b[m.y][m.x]&&b[m.y][m.x].t=='K')v=WIN;
      else{make(m);v=(PAIN&&d==1)?-qs(side^1,-INF,INF,4):-ab(side^1,d-1,-INF,-al,1);unmake(m)}
      if(aborted)break;
      if(PAIN&&v<WIN-100)v=pain(side,m,v,base0,d==1||bm===null||v>al);
      if(bm===null||v>al){al=v;bm=m}
    }
    if(aborted)break;
    best=bm;doneD=d;score=al;
    root.splice(root.indexOf(bm),1);root.unshift(bm);
    if(al>WIN-100)break;
  }
  const f=n=>n.toLocaleString('uk');
  let t=`${name} · глибина ${doneD}/${D} · вузлів ${f(nodes)} · відсікань ${f(CUT)} · ${Date.now()-t0} мс · оцінка ${(score/100).toFixed(2)}`;
  if(ATT)t+=' · ходи: '+CL.map((n,i)=>CNT[i]?n+' '+f(CNT[i]):'').filter(Boolean).join(', ');
  if(PAIN){let n=0,sum=0;for(const P of PAIN)for(const v of P)if(v<0){n++;sum+=v}t+=` · болів: ${n} кліток, сума ${sum.toFixed(2)}`}
  document.getElementById('cnt').textContent=t;
  lastPain=PAIN;PAIN=null;SORTMID=false;ATT=false;
  return best;
}
const NM=['alphabeta','alphabeta takes check small on big or new attacks','alphabeta middletosides sort','test pains board alphabeta'];
engines[NM[0]]=()=>runAB(NM[0],false,false,false);
engines[NM[1]]=()=>runAB(NM[1],false,false,true);
engines[NM[2]]=()=>runAB(NM[2],true,false,false);
engines[NM[3]]=()=>runAB(NM[3],false,true,false);

const TYPES_DS='PNBRACQK';
const ZOB_R=[]; (function(){const rnd=()=>(Math.random()*0x100000000)|0;
  for(let r=0;r<N;r++){ZOB_R[r]=[];for(let c=0;c<N;c++){ZOB_R[r][c]=[];
    for(let t=0;t<8;t++)ZOB_R[r][c][t]=[rnd(),rnd()];}}})();

function attackedBy(side,r,c){

    if(px>=0&&px<N){const p=b[py][px];

function sameMove(a,o){return a&&o&&a.r===o.r&&a.c===o.c&&a.y===o.y&&a.x===o.x;}

function dsOrder(l,ttMove,ply){

function attackedByKnightOnly(side,r,c){

    }
  }

}
function attackedByRookOnly(side,r,c){
  for(let i=0;i<4;i++){
    let y=r+ROOK[i][0],x=c+ROOK[i][1];
    while(y>=0&&y<N&&x>=0&&x<N){
      const p=b[y][x];

}
function evSpecial(side){

  const oppR0=side===0?N-2:0, oppR1=side===0?N-1:1;

  for(let r=0;r<N;r++){
    const row=b[r];
    const inOwn=(r===ownR0||r===ownR1);
    const inOpp=(r===oppR0||r===oppR1);
    for(let c=0;c<N;c++){
      const p=row[c];if(!p)continue;
      // Базова матеріальна оцінка (вбудована, як у ev())
      let mv = VAL[p.t]*100;
      if(p.t=='P')mv+=(p.w?N-1-r:r)*2;
      else if(p.t!='K')mv+=8-Math.abs(r-8)*.5-Math.abs(c-8)*.5;
      s += p.w ? mv : -mv;
      // Зональні бонуси/штрафи (ваша спецоцінка)
      if(p.w===side){
        if(inOwn)s+=1;
        else if(inOpp)s+=0.1;
      } else {
        if(inOwn)s-=1.5;
        else if(inOpp)s-=0.15;
      }
    }
  }
  // Тактичні штрафи
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++){
      const p=b[r][c];if(!p)continue;
      const sign=p.w===side?-1:1;
      const enemy=p.w^1;
      if(p.t==='R'&&attackedByKnightOnly(enemy,r,c))s+=sign*300;
      if(p.t==='Q'&&attackedByRookOnly(enemy,r,c))s+=sign*900;
    }

}

function evSpecialFast(side){
  const ownR0 = side===0?0:N-2, ownR1 = side===0?1:N-1;
  const oppR0 = side===0?N-2:0, oppR1 = side===0?N-1:1;
  const KNIGHT_OFFS = [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
  let s = 0;
  const rooks = [];
  const queens = [];
  for(let r=0;r<N;r++){
    const row = b[r];
    const inOwn = (r === ownR0 || r === ownR1);
    const inOpp = (r === oppR0 || r === oppR1);
    for(let c=0;c<N;c++){
      const p = row[c];
      if(!p) continue;
      const isMine = p.w === side;
      let mv = VAL[p.t] * 100;
      if(p.t === 'P') mv += (p.w ? N-1-r : r) * 2;
      else if(p.t !== 'K') mv += 8 - Math.abs(r-8)*0.5 - Math.abs(c-8)*0.5;
      s += isMine ? mv : -mv;
      if(isMine){
        if(inOwn) s += 1;
        else if(inOpp) s += 0.1;
      } else {
        if(inOwn) s -= 1.5;
        else if(inOpp) s -= 0.15;
      }
      if(p.t === 'R' || p.t === 'C' || p.t === 'Q') rooks.push({r, c, w: p.w});
      if(p.t === 'Q') queens.push({r, c, w: p.w});
      if(p.t === 'R'){
        const enemyColor = p.w ^ 1;
        const sign = isMine ? -1 : 1;
        let attacked = false;
        for(const [dr,dc] of KNIGHT_OFFS){
          const kr = r+dr, kc = c+dc;
          if(kr>=0 && kr<N && kc>=0 && kc<N){
            const kp = b[kr][kc];
            if(kp && kp.w === enemyColor && (kp.t === 'N' || kp.t === 'A' || kp.t === 'C')){
              attacked = true; break;

        if(attacked) s += sign * 300;

    for(const rk of rooks){

      let attacked = false;
      if(rk.r === q.r && rk.c !== q.c){
        let clear = true;
        const step = rk.c < q.c ? 1 : -1;
        for(let x = rk.c + step; x !== q.c; x += step){

        let clear = true;
        const step = rk.r < q.r ? 1 : -1;
        for(let y = rk.r + step; y !== q.r; y += step){

        }

      }
      if(attacked){ s += sign * 900; break; }
    }
  }
  return s;
}

      else if (t === 'A' || t === 'C') v += Math.max(0, 10 - cd) * 2;
      else if (t === 'Q') v += Math.max(0, 6 - cd) * 2;
      else if (t === 'K') {

const MCTS_C=1.4;
const MCTS_MAX_NODES=100000;
const MCTS_ROLLOUT_DEPTH=80;
function mctsNewNode(parent, move){
  return {parent, move, children:[], visits:0, wins:0, untried:null, terminal:false, terminalVal:0};
}
function mctsInitUntried(node, side){
  const moves=gen(side,false);
  for(const m of moves){
    const cap=b[m.y][m.x];
    m.s=cap?(1+Math.random()):(Math.random()*0.1);
  }
  moves.sort((a,b)=>b.s-a.s);
  node.untried=moves;
}
function mctsRollout(side, depth){
  let plies=0;
  while(plies<depth){
    let wK=false,bK=false;
    for(let r=0;r<N;r++){for(let c=0;c<N;c++){const p=b[r][c];
      if(p&&p.t==='K'){if(p.w===0)wK=true;else bK=true;}}}
    if(!wK)return 0;
    if(!bK)return 1;
    const moves=gen(side,false);
    if(!moves.length)return 0.5;
    let chosen=null;
    const rnd=Math.random();
    if(rnd<0.7){
      let best=-1;
      for(const m of moves){
        const t=b[m.y][m.x];
        if(t){const v=VAL[t.t];if(v>best){best=v;chosen=m;}}
      }
    } else if(rnd<0.85){
      for(const m of moves){
        make(m);const chk=isInCheckDS(side^1);unmake(m);
        if(chk){chosen=m;break;}
      }
    }
    if(!chosen)chosen=moves[Math.random()*moves.length|0];
    make(chosen);
    const cap=b[chosen.y][chosen.x];
    if(cap&&cap.t==='K'){
      unmake(chosen);
      return (side===0)?1:0;
    }
    unmake(chosen);
    make(chosen);
    const movedT=b[chosen.y][chosen.x];
    if(movedT.t==='P'&&(chosen.y===0||chosen.y===N-1))movedT.t='Q';
    side^=1;
    plies++;
  }
  return 0.5;
}
function mctsBackprop(node, result, sideToMove){
  let s=sideToMove;
  while(node){
    node.visits++;
    if(node.move){
      const mover=s^1;
      node.wins+=(mover===0)?result:(1-result);
    }
    s^=1;
    node=node.parent;
  }
}
function runMCTS(){
  ATT=false;
  const T=(+document.getElementById('tm').value||3)*1000;
  const D=+document.getElementById('dp').value||2;
  const t0=Date.now();
  const deadline=t0+T;
  const side=turn;
  const root=mctsNewNode(null,null);
  mctsInitUntried(root, side);
  let iterations=0;
  const boardBackup=JSON.stringify(b);
  while(Date.now()<deadline && iterations<D*200000){
    let node=root;
    let s=side;
    while(node.untried.length===0 && node.children.length>0){
      const logN=Math.log(node.visits+1);
      let best=null,bestUcb=-Infinity;
      for(const ch of node.children){
        const exploit=ch.wins/(ch.visits+1e-9);
        const explore=MCTS_C*Math.sqrt(logN/(ch.visits+1));
        const ucb=exploit+explore;
        if(ucb>bestUcb){bestUcb=ucb;best=ch;}
      }
      node=best;
      s^=1;
    }
    if(node.untried.length>0){
      const m=node.untried.pop();
      const cap=b[m.y][m.x];
      if(cap&&cap.t==='K'){
        node.terminal=true;
        node.terminalVal=(s===0)?1:0;
        mctsBackprop(node, node.terminalVal, s);
        iterations++;
        continue;
      }
      m.pt=b[m.r][m.c].t;
      make(m);
      const p=b[m.y][m.x];
      if(p.t==='P'&&(m.y===0||m.y===N-1))p.t='Q';
      const child=mctsNewNode(node,m);
      mctsInitUntried(child, s^1);
      node.children.push(child);
      node=child;
      s^=1;
    }
    const result=mctsRollout(s, MCTS_ROLLOUT_DEPTH);
    b=JSON.parse(boardBackup);
    mctsBackprop(node, result, s);
    iterations++;
    if(root.children.length>MCTS_MAX_NODES/100){
      root.children.sort((a,b)=>b.visits-a.visits);
      root.children=root.children.slice(0,100);

    if(ch.visits<30)continue;
    const wr=ch.wins/ch.visits;
    if(wr>bestWR){bestWR=wr;best=ch;}
  }
  if(!best){
    for(const ch of root.children){
      if(!best||ch.visits>best.visits)best=ch;
    }
  }
  const f=n=>n.toLocaleString('uk');
  let t=`mcts · ітерацій ${f(iterations)} · дітей ${root.children.length} · ${Date.now()-t0} мс`;
  if(best){
    const wr=best.visits>0?(best.wins/best.visits*100).toFixed(1):'—';
    t+=` · winrate ${wr}% · візитів ${best.visits}`;
  }
  document.getElementById('cnt').textContent=t;
  if(!best){const fb=gen(turn,false);return fb.length?fb[0]:null;}
  return best.move;
}

const MCTS_EVAL_C=1.4;

function mctsEvalRollout(side){

    if(!bK)return 1;

function runMCTSEval(){

      let best=null,bestV=-Infinity;
      for(const ch of node.children){
        const q=ch.wins/(ch.visits+1e-9);

        if(ucb>bestV){bestV=ucb;best=ch;}

    }
    const result=mctsEvalRollout(s);

}

const MCTS_RAVE_C = 1.4;
const MCTS_RAVE_ROLLOUT = 14;
const MCTS_RAVE_AMAF_MAX = 500;
function raveKey(m){ return m.r*4913 + m.c*289 + m.y*17 + m.x; }
function raveRollout(side, stack){
  let plies = 0;
  const moves = [];
  while (plies < MCTS_RAVE_ROLLOUT) {
    let wK = false, bK = false;
    for (let r = 0; r < N; r++) {
      const row = b[r];
      for (let c = 0; c < N; c++) {
        const p = row[c];
        if (p && p.t === 'K') { if (p.w === 0) wK = true; else bK = true; }
      }
    }
    if (!wK) return { result: 0, moves };
    if (!bK) return { result: 1, moves };
    const ml = gen(side, false);
    if (!ml.length) return { result: 0.5, moves };
    let chosen = null;
    if (Math.random() < 0.6) {
      let best = -1;
      for (const m of ml) {
        const t = b[m.y][m.x];
        if (t) { const v = VAL[t.t]; if (v > best) { best = v; chosen = m; } }
      }
    }
    if (!chosen) chosen = ml[Math.random() * ml.length | 0];
    make(chosen);
    stack.push(chosen);
    moves.push({ key: raveKey(chosen), side });
    side ^= 1;
    plies++;
  }
  const e = ev(side);
  const wp = 1 / (1 + Math.exp(-e / 200));
  return { result: side === 0 ? wp : 1 - wp, moves };
}
function raveSelect(node){
  let best = null, bestV = -Infinity;
  const logN = Math.log(node.visits + 1);
  for (const ch of node.children) {
    const v = ch.visits, w = ch.wins;
    const am = node.amaf.get(raveKey(ch.move));
    const av = am ? am.visits : 0;
    const aw = am ? am.wins : 0;
    const q = v > 0 ? w / v : 0.5;
    const aq = av > 0 ? aw / av : q;
    const beta = av / (av + v + 4 * av * v / 100 + 1e-9);
    const mixed = (1 - beta) * q + beta * aq;
    const explore = MCTS_RAVE_C * Math.sqrt(logN / (v + 1));
    const uct = mixed + explore;
    if (uct > bestV) { bestV = uct; best = ch; }
  }
  return best;
}
function raveBackprop(node, result, moves){
  let cur = node;
  while (cur) {
    cur.visits++;
    if (cur.parent) {
      cur.wins += (cur.side === 0 ? result : 1 - result);
    }
    for (const { key, side } of moves) {
      if (side !== cur.side) continue;
      let a = cur.amaf.get(key);
      if (a) {
        a.visits++;
        a.wins += (cur.side === 0 ? result : 1 - result);
      } else if (cur.amaf.size < MCTS_RAVE_AMAF_MAX) {
        cur.amaf.set(key, { visits: 1, wins: (cur.side === 0 ? result : 1 - result) });
      }
    }
    cur = cur.parent;
  }
}
function runMCTSRAVE(){

  const t0 = Date.now(), deadline = t0 + T;
  const root = {

  const stack = [];
  let iterations = 0;
  while (Date.now() < deadline) {
    let node = root;
    while (node.untried.length === 0 && node.children.length > 0) {
      const next = raveSelect(node);
      if (!next) break;
      make(next.move);
      stack.push(next.move);
      node = next;
    }
    let result, moves = [], terminal = false;
    if (node.untried.length > 0) {

    raveBackprop(node, result, moves);

  }
  let best = null, bestV = -1;
  for (const ch of root.children) {
    if (ch.visits > bestV) { bestV = ch.visits; best = ch; }
  }
  const f = n => n.toLocaleString('uk');
  let msg = `mcts rave · ітерацій ${f(iterations)} · дітей ${root.children.length} · ${Date.now() - t0} мс`;

  }

  if (!best) { const fb = gen(turn, false); return fb.length ? fb[0] : null; }

}

  if(!bm){const n=cgen(s,0,false);if(n)bm=cpick(CMV[0],CMS[0],0,n)}
  let t=`Claude · глибина ${dd} · вузлів ${cn.toLocaleString('uk')} · ${Date.now()-t0} мс · оцінка ${(bs/100).toFixed(2)}`;
  if(Math.abs(bs)>CWIN-500)t+=` · ${bs>0?'МАТ у':'програш мат у'} ${Math.ceil((CWIN-Math.abs(bs))/2)}`;
  document.getElementById('cnt').textContent=t;
  if(!bm)return null;
  const f=bm&1023,to=(bm>>10)&1023;
  return {r:CROW[f],c:f%21-2,y:CROW[to],x:to%21-2}}
engines['Claude']=()=>runClaude();
/*W1*/

let timer;
/*
  Рушії працюють у Web Worker, зібраному з цього ж скрипту (між маркерами W0/W1).
  Якщо Worker недоступний, пошук іде в основному потоці, як раніше.
*/
const WSRC=(()=>{const s=document.getElementById('app').textContent;
  const re=new RegExp('/\\*W0\\*/([\\s\\S]*?)/\\*W1\\*/','g');let o='';
  for(const m of s.matchAll(re))o+=m[1]+'\n';return o+`
let b,turn,MV=[];let _CNT='';
const _F={dp:{value:'2'},tm:{value:'3'},ao:{checked:false},cnt:{set textContent(v){_CNT=v},get textContent(){return _CNT}}};
const document={getElementById:id=>_F[id]||{}};
const all=()=>{const l=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=b[r][c];
  if(p&&p.w==turn)for(const[y,x]of moves(r,c))l.push({r,c,y,x})}return l};
onmessage=e=>{const d=e.data;b=d.b;turn=d.turn;MV=d.MV;_F.dp.value=d.dp;_F.tm.value=d.tm;_F.ao.checked=d.ao;_CNT='';
  let m=null,err=null;
  try{m=engines[d.name](all())}catch(x){err=String(x&&x.stack||x)}
  postMessage({id:d.id,m:m?{r:m.r,c:m.c,y:m.y,x:m.x}:null,cnt:_CNT,err})};
`})();
let W=null,busy=false,job=0,useW=true;
function cancelThink(){job++;busy=false;if(W){try{W.terminate()}catch(_){}W=null}}
function getW(){if(W)return W;W=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})));return W}
function tick(){
  clearTimeout(timer);
  if(over||paused||busy)return;
  const e=side();if(e=='human')return;
  timer=setTimeout(()=>{
    const run=()=>{
      if(over||paused||busy||side()!=e)return;
      const l=all();
      if(!l.length){over=true;note='Немає ходів';draw();return}
      const rnd=()=>l[Math.random()*l.length|0];
      const done=m=>{busy=false;
        if(!m){over=true;note='Рушій не знайшов ходу';draw();return}
        mv(m.r,m.c,m.y,m.x)};
      if(e==='random'||e==='greedy'||!useW){
        let m;try{m=engines[e](l)}catch(err){console.error('Engine error:',e,err);m=rnd()}
        done(m);return}
      busy=true;const my=++job;
      try{
        const w=getW();
        w.onmessage=ev2=>{if(my!==job)return;const d=ev2.data;
          document.getElementById('cnt').textContent=d.cnt||'';
          if(d.err){console.error('Engine error:',e,d.err);done(rnd())}else done(d.m)};
        w.onerror=err=>{if(my!==job)return;console.error('Worker error',err);
          cancelThink();useW=false;tick()};
        w.postMessage({id:my,name:e,b,turn,MV,
          dp:document.getElementById('dp').value,tm:document.getElementById('tm').value,
          ao:document.getElementById('ao').checked});
      }catch(err){console.error('Worker unavailable',err);cancelThink();useW=false;tick()}
    };
    if(e!=='random'&&e!=='greedy'){document.getElementById('msg').textContent='Рушій думає…';setTimeout(run,40)}else run();
  },180);
}

function click(r,c){
  if(over||side()!='human')return;
  if(sel&&sel.m.some(m=>m[0]==r&&m[1]==c)){mv(sel.r,sel.c,r,c);return}
  const p=b[r][c];
  sel=(p&&p.w==turn)?{r,c,m:moves(r,c)}:null;draw();
}
const tap=e=>{
  const sv=bd.querySelector('svg');if(!sv)return;
  const q=sv.getBoundingClientRect(),c=Math.floor((e.clientX-q.left)/CELL),r=Math.floor((e.clientY-q.top)/CELL);
  if(r>=0&&c>=0&&r<N&&c<N)click(r,c);
};
let drag=null;
wr.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sl:wr.scrollLeft,st:wr.scrollTop,moved:false};try{wr.setPointerCapture(e.pointerId)}catch(_){}});
wr.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;
  if(drag.moved){wr.scrollLeft=drag.sl-dx;wr.scrollTop=drag.st-dy}
});
wr.addEventListener('pointerup',e=>{if(drag&&!drag.moved)tap(e);drag=null});
wr.addEventListener('pointercancel',()=>{drag=null});

function draw(){
  const S=N*CELL,m=CELL/2;
  const mk=(id,col)=>`<marker id="${id}" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 .5L6 3L0 5.5z" fill="${col}"/></marker>`;
  let h=`<svg width="${S}" height="${S}" style="display:block"><defs>${mk('mg','#1b8a3a')}${mk('mr','#d32f2f')}${mk('mo','#ff9800')}</defs>`;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)
    h+=`<rect x="${c*CELL}" y="${r*CELL}" width="${CELL}" height="${CELL}" fill="${(r+c)%2?'#f2d230':'#d6d6d6'}"/>`;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=b[r][c];if(!p)continue;
    h+=`<g transform="translate(${c*CELL+CELL*.1} ${r*CELL+CELL*.1}) scale(${CELL*.8/20})" fill="${p.w?'#e53935':'#1e5fe0'}" stroke="${p.w?'#ff8080':'#6699ff'}" stroke-width="1"><path d="${IC[p.t]}" vector-effect="non-scaling-stroke"/></g>`;
    // Круг туроконя (C) / слоноконя (A): ЦЕНТР, половина розміру, світло-залитий з темною обводкою
    if(p.t==='A'||p.t==='C'){
      const cx=c*CELL+CELL/2;
      const cy=r*CELL+CELL/2;
      const rad=CELL*0.10;
      const fill = p.w ? '#ffaaaa' : '#99ccff';
      const stroke = p.w ? '#990000' : '#003399';
      h+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${fill}" stroke="${stroke}" stroke-width="1" pointer-events="none"/>`;
    }
  }
  const L=(r,c,y,x,col,k)=>`<line x1="${c*CELL+m}" y1="${r*CELL+m}" x2="${x*CELL+m}" y2="${y*CELL+m}" stroke="${col}" stroke-width="1" opacity=".8" marker-end="url(#${k})"/>`;
  if(!over&&document.getElementById('ar').checked)
    for(const a of all()){const cp=b[a.y][a.x];h+=L(a.r,a.c,a.y,a.x,cp?'#d32f2f':'#1b8a3a',cp?'mr':'mg')}
  if(last)for(const[r,c]of[[last[0],last[1]],[last[2],last[3]]])
    h+=`<rect x="${c*CELL+.5}" y="${r*CELL+.5}" width="${CELL-1}" height="${CELL-1}" fill="none" stroke="#8e24aa" stroke-width="1"/>`;
  if(last)h+=L(...last,'#ff9800','mo');
  if(sel){
    h+=`<rect x="${sel.c*CELL+.5}" y="${sel.r*CELL+.5}" width="${CELL-1}" height="${CELL-1}" fill="none" stroke="#8e24aa" stroke-width="1"/>`;
    for(const[y,x]of sel.m)h+=`<rect x="${x*CELL+3}" y="${y*CELL+3}" width="${CELL-6}" height="${CELL-6}" fill="none" stroke="#8e24aa" stroke-width="1"/>`;
  }
  h+='</svg>';
  const sl=wr.scrollLeft,st=wr.scrollTop;bd.style.padding=wr.clientHeight+'px '+wr.clientWidth+'px';bd.innerHTML=h;wr.scrollLeft=sl;wr.scrollTop=st;
  const status=over?note:(turn?'Хід білих':'Хід чорних')+' · хід №'+(cur+1);
  document.getElementById('msg').textContent=`Пам’ять ${slot} з ${SLOTS} · ${status}`;
  tick();
}
document.getElementById('u').onclick=()=>go(-1);
document.getElementById('f').onclick=()=>go(1);
const fit=()=>{CELL=Math.max(14,Math.floor((Math.min(wr.clientWidth,wr.clientHeight)-16)/N))};
const center=()=>{wr.scrollLeft=wr.clientWidth-(wr.clientWidth-N*CELL)/2;wr.scrollTop=wr.clientHeight-(wr.clientHeight-N*CELL)/2};
const zoom=d=>{CELL=Math.max(14,Math.min(90,CELL+d));draw()};
document.getElementById('zm').onclick=()=>zoom(-0.6);
document.getElementById('zp').onclick=()=>zoom(0.6);
document.getElementById('fit').onclick=()=>{fit();draw();center()};
document.getElementById('ar').onchange=draw;
document.getElementById('n').onclick=()=>openSlot(slot%SLOTS+1,true);
document.getElementById('p').onclick=e=>{paused=!paused;if(paused)cancelThink();e.target.textContent=paused?'Продовжити':'Пауза';tick()};
document.getElementById('w').onchange=()=>{updInfo();cancelThink();tick()};
document.getElementById('k').onchange=()=>{updInfo();cancelThink();tick()};
const kp=document.getElementById('kp'),kd=document.getElementById('kd');let kv='';
const kshow=t=>{kd.textContent=t||kv||'—'};
[...'123456789','⌫','0','OK'].forEach(k=>{
  const e=document.createElement('button');e.textContent=k;
  e.onclick=()=>{
    if(k=='OK'){const n=parseInt(kv,10);if(n>=1&&n<=SLOTS){kp.hidden=true;openSlot(n,false)}else kshow('введи 1–'+SLOTS);return}
    if(k=='⌫')kv=kv.slice(0,-1);else if(kv.length<3)kv+=k;
    kshow();
  };
  document.getElementById('kg').append(e);
});
document.getElementById('m').onclick=()=>{kv='';kshow();kp.style.left='50%';kp.style.top='50%';kp.style.transform='translate(-50%,-50%)';kp.hidden=false};
let kdrag=null,kmoved=false;
kp.style.touchAction='none';
kp.addEventListener('pointerdown',e=>{const q=kp.getBoundingClientRect();kdrag={x:e.clientX,y:e.clientY,l:q.left,t:q.top,id:e.pointerId,cap:false};kmoved=false});
kp.addEventListener('pointermove',e=>{
  if(!kdrag)return;
  const dx=e.clientX-kdrag.x,dy=e.clientY-kdrag.y;
  if(!kmoved&&Math.abs(dx)+Math.abs(dy)>8){kmoved=true;try{kp.setPointerCapture(kdrag.id)}catch(_){}}
  if(kmoved){kp.style.transform='none';kp.style.left=(kdrag.l+dx)+'px';kp.style.top=(kdrag.t+dy)+'px'}
});
kp.addEventListener('pointerup',()=>{kdrag=null});
kp.addEventListener('pointercancel',()=>{kdrag=null});
kp.addEventListener('click',e=>{if(kmoved){e.stopPropagation();e.preventDefault();kmoved=false}},true);
document.getElementById('kx').onclick=()=>{kp.hidden=true};
updInfo();
fit();openSlot(Number(store.get('c17_cur'))||1,false);center();
</script></body></html>
